experiment:
  name: object_centering_dqn

task:
  name: object_centering
  center_target: 0.5
  tolerance: 0.05

algorithm:
  name: dqn

training:
  episodes: 3
  batch_size: 32
  checkpoint_interval: 10
  max_steps_per_episode: 200
  log_interval_steps: 20
  action_duration: 0.10


agent:
  gamma: 0.99
  learning_rate: 0.001
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995
  target_update_interval: 100

paths:
  model: models/object_centering_dqn.pth
  replay_buffer: memory/object_centering_dqn.pkl
  reward_log: logs/object_centering_dqn_rewards.csv